baseURL = "https://fussball-harleshausen.de/"
defaultContentLanguage = "de"
title = "Förderverein Fußball Harleshausen 95 e.V."
theme = "ananke"

[languages.de]
  locale = "de-DE"
  label = "Deutsch"
  weight = 1

[pagination]
  pagerSize = 12

[taxonomies]
  # Keine Tags/Kategorien nötig

[outputs]
  home = ["HTML"]
  section = ["HTML"]

[markup.goldmark.renderer]
  hardWraps = true
  unsafe = true

[params]
  description = "Der Förderverein Fußball Harleshausen 95 e.V. unterstützt den Fußball der SVH Kassel – insbesondere die Fußballjugend: Trainingsausrüstung, sportliche Weiterbildung und fußballerische Entwicklung."
  claim = "Gemeinsam. Engagiert. Für unsere Fußballjugend."
  favicon = "images/favicon.png"
  logo = "images/logo.png"
  body_classes = "fv"
  date_format = "2. January 2006"

  # Kontaktdaten (zentral gepflegt, werden in Footer, Impressum und Kontakt genutzt)
  email = "Foerderverein-F-H95@gmx.de"
  # Postanschrift und Telefon werden nur angezeigt, wenn sie hier eingetragen sind.
  # Für das Impressum ist eine ladungsfähige Anschrift Pflicht.
  phone = ""
  street = ""
  city = ""

  # Spendenkonto
  accountHolder = "Förderverein Fussball Harleshausen 95 e.V."
  bank = "Kasseler Sparkasse"
  iban = "DE13 5205 0353 0011 8565 02"
  bic = "HELADEF1KAS"

  # Hauptverein
  clubName = "SVH Kassel 1945"
  clubUrl = "https://www.svhkassel-fussball.de/"

  # Formular-Endpunkt (z. B. Formspree, Getform, eigener Server).
  # GitHub Pages kann selbst keine Formulare verarbeiten. Solange hier
  # nichts steht, öffnen die Formulare das E-Mail-Programm (mailto).
  formEndpoint = ""

  # Mitgliedsbeitrag
  membershipFee = "30 €"        # Mindestbeitrag pro Jahr
  membershipFeeAlt = "50 €"
  creditorId = "DE06ZZZ00002586463"  # Gläubiger-ID für das SEPA-Lastschriftmandat

  [params.ananke]
    custom_css = ["fv.css"]

  [params.social]
    facebook = ""
    instagram = ""

[menus]
  [[menus.main]]
    name = "Startseite"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Über uns"
    pageRef = "/ueber-uns"
    weight = 20
  [[menus.main]]
    name = "Förderprojekte"
    pageRef = "/projekte"
    weight = 30
  [[menus.main]]
    name = "Premium-Sponsoring"
    pageRef = "/sponsoring"
    weight = 40
  [[menus.main]]
    name = "Kontakt"
    pageRef = "/kontakt"
    weight = 50

  [[menus.footer]]
    name = "Kontakt"
    pageRef = "/kontakt"
    weight = 10
  [[menus.footer]]
    name = "Impressum"
    pageRef = "/impressum"
    weight = 20
  [[menus.footer]]
    name = "Datenschutz"
    pageRef = "/datenschutz"
    weight = 30
