# Vorstand des Fördervereins (Quelle: svhkassel-fussball.de/foerderverein).
# Fotos unter assets/images/vorstand/ ablegen (JPG oder PNG, möglichst quadratisch,
# Gesicht etwa mittig) und z. B. "bild: images/vorstand/marcus-draebing.jpg" eintragen.
# Hugo erzeugt daraus automatisch WebP-Varianten.
- name: Marcus Dräbing
  funktion: 1. Vorsitzender
  text: Leitet den Förderverein und ist erster Ansprechpartner für Mitglieder, Spender und Unternehmen.
  email: info@fussball-harleshausen.de
- name: Andre Ben Mansour
  funktion: 2. Vorsitzender
  text: Vertritt den Vorsitzenden und unterstützt bei Projekten und Aktionen für die Jugendteams.
- name: Andreas Lihs
  funktion: Schriftführer & Kassenprüfer
  text: Dokumentiert die Arbeit des Vorstands und prüft die ordnungsgemäße Verwendung der Mittel.
  bild: images/vorstand/andreas-lihs.jpg
- name: Christina Dräbing
  funktion: Kassenwartin
  text: Verwaltet die Finanzen, Mitgliedsbeiträge und Spenden des Fördervereins.
  bild: images/vorstand/christina-draebing.jpg
