{{- /* Girocode (EPC-QR-Code) für Überweisungen an das Spendenkonto.
     {{< girocode zweck="Spende" >}} – Verwendungszweck ist optional und in der Banking-App änderbar. */ -}}
{{- $p := site.Params -}}
{{- with partial "girocode-qr.html" (dict "zweck" (.Get "zweck")) -}}
<figure class="fv-girocode">
  <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="Girocode für eine Überweisung an {{ $p.accountHolder }}, IBAN {{ $p.iban }}">
  <figcaption>Mit der Banking-App scannen – Empfänger und IBAN sind dann schon ausgefüllt. Den Betrag wählen Sie selbst.</figcaption>
</figure>
{{- end -}}
