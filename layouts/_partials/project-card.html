<article class="fv-card fv-card--media">
  <a href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true">
    <img class="fv-card__img" src="{{ .Params.image | default "images/projekt-platzhalter.svg" | relURL }}" alt="" loading="lazy">
  </a>
  <div class="fv-card__body">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="fv-muted fv-small">{{ .Description | default .Summary | plainify | truncate 140 }}</p>
    <div class="fv-card__foot">
      <span class="fv-card__meta fv-mb0">{{ partial "project-meta.html" . }}</span>
      <a class="fv-btn fv-btn--outline fv-btn--sm" href="{{ .RelPermalink }}">Mehr erfahren</a>
    </div>
  </div>
</article>
